[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-mood"
version = "0.1.0"
description = "🎮 Analyze your git commits to visualize your coding mood, energy, and work patterns over time"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PHclaw", email = "phclaw@example.com"}
]
keywords = ["git", "mood", "analytics", "developer-tools", "cli", "visualization", "sentiment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
llm = ["openai>=1.0.0"]

[project.scripts]
git-mood = "git_mood.cli:main"

[project.urls]
Homepage = "https://github.com/PHclaw/git-mood"
Repository = "https://github.com/PHclaw/git-mood"
Issues = "https://github.com/PHclaw/git-mood/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
